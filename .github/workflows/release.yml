# Push a tag like v1.2 (or v1.2.3) to build Linux and macOS binaries and publish a GitHub release.
name: release

on:
  push:
    tags: ["v*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      # Pure-Go SQLite, so CGO stays off and every OS/arch cross-compiles from one runner.
      # (Go ad-hoc signs darwin/arm64 binaries itself, which is all Apple Silicon needs to run them.)
      - name: Build
        run: |
          mkdir dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o margin .
              tar -czf "dist/margin_${GITHUB_REF_NAME}_${os}_${arch}.tar.gz" margin README.md
            done
          done
          cd dist && sha256sum * > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
