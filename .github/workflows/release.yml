# Push a tag like v1.2 (or v1.2.3) to build Linux binaries and publish a GitHub release.
name: release

on:
  push:
    tags: ["v*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      # Pure-Go SQLite, so CGO stays off and both architectures cross-compile from one runner.
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o margin .
            tar -czf "dist/margin_${GITHUB_REF_NAME}_linux_${arch}.tar.gz" margin README.md
          done
          cd dist && sha256sum * > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
